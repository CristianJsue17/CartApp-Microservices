#!/bin/bash

set -e

EC2_USER="ubuntu"
EC2_HOST=$1
APP_DIR="/home/ubuntu/apps/app-carrito"

if [ -z "$EC2_HOST" ]; then
  echo "❌ Error: EC2_HOST is required"
  echo "Usage: ./deploy.sh <EC2_IP>"
  exit 1
fi

echo "🚀 Starting deployment to $EC2_HOST..."

# SSH y ejecutar comandos con debugging
ssh -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} << 'ENDSSH'
  set -e
  set -x  # ⭐ Mostrar comandos mientras se ejecutan
  
  # Verificar que el directorio existe
  if [ ! -d "/home/ubuntu/apps/app-carrito" ]; then
    echo "❌ Directory /home/ubuntu/apps/app-carrito does not exist!"
    exit 1
  fi
  
  cd /home/ubuntu/apps/app-carrito
  
  echo "📥 Pulling latest code..."
  git fetch origin
  git checkout aws-apiGateway-apiKey-cors-JWT
  git reset --hard origin/aws-apiGateway-apiKey-cors-JWT
  
  echo "📦 Installing dependencies..."
  cd auth-service && npm install --production && cd ..
  cd catalog-service && npm install --production && cd ..
  cd cart-service && npm install --production && cd ..
  cd order-service && npm install --production && cd ..
  
  echo "🔄 Reloading services with PM2..."
  
  # Verificar que PM2 existe
  which pm2 || { echo "❌ PM2 not found!"; exit 1; }
  
  pm2 reload auth-service --update-env || pm2 restart auth-service || echo "⚠️ auth-service failed"
  sleep 2
  pm2 reload catalog-service --update-env || pm2 restart catalog-service || echo "⚠️ catalog-service failed"
  sleep 2
  pm2 reload cart-service --update-env || pm2 restart cart-service || echo "⚠️ cart-service failed"
  sleep 2
  pm2 reload order-service --update-env || pm2 restart order-service || echo "⚠️ order-service failed"
  sleep 2
  
  echo "📊 Service status:"
  pm2 list
  
  echo "✅ Deployment complete!"
ENDSSH

if [ $? -eq 0 ]; then
  echo "🎉 All services deployed successfully!"
else
  echo "❌ Deployment failed with exit code $?"
  exit 1
fi